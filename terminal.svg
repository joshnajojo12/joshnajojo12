    </g>

    <g clip-path="url(#line3)" fill="#E6F4EA">
      <text x="5" y="88">B.Tech Computer Science Student</text>
    </g>

    <g clip-path="url(#line4)" fill="#39FF88">
      <text x="5" y="118">joshna@developer:~$ cat interests.txt</text>
    </g>

    <g clip-path="url(#line5)" fill="#A6D9B5">
      <text x="5" y="148">Building applications.</text>
    </g>

    <g clip-path="url(#line6)" fill="#A6D9B5">
