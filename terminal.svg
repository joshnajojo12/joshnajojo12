
<svg xmlns="http://www.w3.org/2000/svg"
     width="850" height="215" viewBox="0 0 850 215">

  <defs>
    <clipPath id="line1"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;420" dur="1s" begin="0s;9s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line2"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;450" dur="1.1s" begin="1.2s;10.2s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line3"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;500" dur="1.2s" begin="2.5s;11.5s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line4"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;510" dur="1.2s" begin="3.9s;12.9s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line5"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;550" dur="1.3s" begin="5.3s;14.3s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line6"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;540" dur="1.3s" begin="6.8s;15.8s" fill="freeze"/>
    </rect></clipPath>

    <clipPath id="line7"><rect x="0" y="0" width="0" height="25">
      <animate attributeName="width" values="0;550" dur="1.3s" begin="8.3s;17.3s" fill="freeze"/>
    </rect></clipPath>
  </defs>

  <g font-family="monospace" font-size="19">

    <g clip-path="url(#line1)" fill="#39FF88">
      <text x="5" y="28">joshna@developer:~$ whoami</text>
    </g>

    <g clip-path="url(#line2)" fill="#E6F4EA">
