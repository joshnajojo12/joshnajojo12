
<svg xmlns="http://www.w3.org/2000/svg"
     width="900" height="230"
     viewBox="0 0 900 230">

  <style>
    text {
      font-family: "Cascadia Code", Consolas, monospace;
      font-size: 16px;
      font-weight: 400;
    }

    .user { fill: #3FB950; }
    .command { fill: #FDE68A; }
    .output { fill: #FFFFFF; }
  </style>

  <defs>
    <!-- Every line reveals progressively, then resets for the next loop -->

    <clipPath id="line1" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="10" width="0" height="26">
        <animate attributeName="width"
          values="0;0;195;195;0"
          keyTimes="0;0.02;0.10;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line2" clipPathUnits="userSpaceOnUse">
      <rect x="225" y="10" width="0" height="26">
        <animate attributeName="width"
          values="0;0;65;65;0"
          keyTimes="0;0.09;0.14;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line3" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="40" width="0" height="26">
        <animate attributeName="width"
          values="0;0;200;200;0"
          keyTimes="0;0.15;0.23;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line4" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="70" width="0" height="26">
        <animate attributeName="width"
          values="0;0;285;285;0"
          keyTimes="0;0.24;0.34;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line5" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="105" width="0" height="26">
        <animate attributeName="width"
          values="0;0;195;195;0"
          keyTimes="0;0.35;0.43;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line6" clipPathUnits="userSpaceOnUse">
      <rect x="225" y="105" width="0" height="26">
        <animate attributeName="width"
          values="0;0;155;155;0"
          keyTimes="0;0.42;0.51;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line7" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="135" width="0" height="26">
        <animate attributeName="width"
          values="0;0;190;190;0"
          keyTimes="0;0.52;0.60;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line8" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="165" width="0" height="26">
        <animate attributeName="width"
          values="0;0;260;260;0"
          keyTimes="0;0.60;0.70;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>

    <clipPath id="line9" clipPathUnits="userSpaceOnUse">
      <rect x="24" y="195" width="0" height="26">
        <animate attributeName="width"
          values="0;0;235;235;0"
          keyTimes="0;0.69;0.79;0.88;1"
          dur="18s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- First prompt -->
  <text x="24" y="30" class="user"
        clip-path="url(#line1)">joshna@developer:~$</text>

  <text x="225" y="30" class="command"
        clip-path="url(#line2)">whoami</text>

  <!-- whoami output -->
  <text x="24" y="60" class="output"
        clip-path="url(#line3)">Full Stack Developer</text>

  <text x="24" y="90" class="output"
        clip-path="url(#line4)">B.Tech Computer Science Student</text>

  <!-- Second prompt -->
  <text x="24" y="125" class="user"
        clip-path="url(#line5)">joshna@developer:~$</text>

  <text x="225" y="125" class="command"
        clip-path="url(#line6)">cat interests.txt</text>

  <!-- Interests -->
  <text x="24" y="155" class="output"
        clip-path="url(#line7)">Building applications.</text>

  <text x="24" y="185" class="output"
        clip-path="url(#line8)">Exploring AI-powered solutions.</text>

  <text x="24" y="215" class="output"
        clip-path="url(#line9)">Contributing to open source.</text>

  <!-- Blinking cursor -->
  <rect x="24" y="222" width="9" height="2" fill="#3FB950">
    <animate attributeName="opacity"
      values="1;0;1"
      dur="0.8s"
      repeatCount="indefinite"
      begin="14.5s"/>
  </rect>

</svg>
